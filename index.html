<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101612">
<title>TRU WASH</title>
<style>
:root{--bg:#101612;--ink:#eef6ee;--dim:#a8c0ae;--line:#2a3c30;--soap:#b7d98a;--card:#18241c;--bad:#c4543a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
button,input{font:inherit;color:inherit}
header{padding:16px 16px 6px} h1{font-size:22px;letter-spacing:.14em;margin:0;font-weight:normal} h1 span{color:var(--soap)}
.sub{color:var(--dim);font-size:13px}
.warn{margin:10px 16px;padding:10px 12px;border:1px solid var(--bad);border-radius:10px;font-size:14px}
.bar{display:flex;gap:8px;padding:8px 16px} input{flex:1;background:#0c120e;border:1px solid var(--line);border-radius:8px;padding:10px}
button{background:var(--soap);color:#14180f;border:0;border-radius:8px;padding:10px 12px;font-weight:bold}
main{padding:0 16px 28px} .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.k{color:var(--soap);font-size:12px;letter-spacing:.12em} .big{font-size:22px;margin:4px 0} .src{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header><h1>TRU <span>WASH</span></h1><p class="sub">Hands. A cat hole. Latrine downhill of the water. FM 21-10. Not a soap.</p></header>
<div class="warn">Waste below the drinking water. Never above it, never in it. Grey water follows the same rule. TRU Water holds the dose. This card does not purify a cup.</div>
<div class="bar"><input id="q" placeholder="hands, latrine, hole…" enterkeyhint="search"><button id="send">Send</button></div>
<main id="out"></main>
<script>
const C=[
{t:"Hands",d:"Before you eat, and after the latrine. Water and friction. Soap if you have it. This ship does not teach you to make soap."},
{t:"Cat hole",d:"One person, on the move. About 1 foot wide and 1 foot deep. Use it. Cover it at once and pack the soil back. Leave no paper on the ground."},
{t:"Where it sits",d:"At least 100 feet from a water source. It drains away from that water, not toward it. Do not dig into the water table. About 100 yards from the mess. Downstream and downhill of camp if the ground allows both."},
{t:"Close it",d:"When the hole is done, fill it, pack it, and mark the spot with the type and the date if you can. The next person should not dig the same ground."},
{t:"Grey water",d:"Wash water and kitchen water are waste. They go downhill of the drinking source, the same as the latrine. A puddle by the spring is a spoiled spring."},
{t:"Gap",d:"No soap formula, no straddle-trench size for a unit, no incinerator. Drinking doses are TRU Water. A boil is not a latrine."}
];
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&","<":"<",">":">"}[c]));}
function card(x){return `<article class="card"><div class="k">WASH</div><div class="big">${esc(x.t)}</div><div>${esc(x.d)}</div><div class="src">FM 21-10 field hygiene: cat hole about 1 ft by 1 ft, latrine at least 100 ft from water and about 100 yd from the mess. No soap formula.</div></article>`;}
function show(l){document.getElementById("out").innerHTML=l.map(card).join("");}
function search(q){q=(q||"").trim().toLowerCase(); if(!q){show(C);return;} const h=C.filter(x=>(x.t+" "+x.d).toLowerCase().includes(q)); document.getElementById("out").innerHTML=h.length?h.map(card).join(""):`<article class="card"><div class="k">GAP</div><div class="big">Not packed</div><div>No invented soap.</div></article>`;}
document.getElementById("send").onclick=()=>search(document.getElementById("q").value);
document.getElementById("q").onkeydown=e=>{if(e.key==="Enter") search(e.target.value);};
show(C);
</script>
</body>
</html>
